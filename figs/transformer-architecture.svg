<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1440" viewBox="0 0 1900 1440" role="img" aria-labelledby="title desc">
<title id="title">Transformer architecture: original encoder-decoder and a common modern decoder-only block</title>
<desc id="desc">Bottom-to-top token flow. The original post-LayerNorm encoder supplies memory keys and values to each decoder cross-attention sublayer. A separate modern pre-RMSNorm causal decoder illustrates RoPE on queries and keys, grouped-query attention, SwiGLU, residual bypass paths, and an inference KV cache.</desc>
