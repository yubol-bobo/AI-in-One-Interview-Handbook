   <g id="text_1">
    <text style="fill: #172b4d; font: 700 27px 'DejaVu Sans'; text-anchor: start" x="43.2" y="41.904844" transform="rotate(-0 43.2 41.904844)">LLM training: regimes within an iterative development lifecycle</text>
   </g>
   <g id="text_2">
    <text style="fill: #52657a; font: 14px 'DejaVu Sans'; text-anchor: start" x="43.2" y="70.103125" transform="rotate(-0 43.2 70.103125)">[To be reviewed]  Conceptual map; reports name boundaries differently. Paths and loops are optional.</text>
   </g>
   <g id="text_3">
    <text style="fill: #52657a; font: 14px 'DejaVu Sans'; text-anchor: middle" x="648" y="110.423125" transform="rotate(-0 648 110.423125)">A distinct mid-training run may be skipped</text>
   </g>
   <g id="text_4">
    <text style="fill: #172b4d; font: 700 20px 'DejaVu Sans'; text-anchor: start" x="51.84" y="199.19875" transform="rotate(-0 51.84 199.19875)">1  BROAD PRE-TRAINING</text>
   </g>
   <g id="text_5">
    <text style="fill: #52657a; font: 13px 'DejaVu Sans'; text-anchor: start" x="51.84" y="224.627188" transform="rotate(-0 51.84 224.627188)">Broad language, knowledge, code and reasoning</text>
   </g>
   <g id="text_6">
    <text style="fill: #172b4d; font: 700 20px 'DejaVu Sans'; text-anchor: start" x="483.84" y="199.19875" transform="rotate(-0 483.84 199.19875)">2  CONTINUED TRAINING</text>
   </g>
   <g id="text_7">
    <text style="fill: #52657a; font: 13px 'DejaVu Sans'; text-anchor: start" x="483.84" y="224.627188" transform="rotate(-0 483.84 224.627188)">Optional mid-training / late pre-training</text>
   </g>
   <g id="text_8">
    <text style="fill: #172b4d; font: 700 20px 'DejaVu Sans'; text-anchor: start" x="915.84" y="199.19875" transform="rotate(-0 915.84 199.19875)">3  POST-TRAINING</text>
   </g>
   <g id="text_9">
    <text style="fill: #52657a; font: 13px 'DejaVu Sans'; text-anchor: start" x="915.84" y="224.627188" transform="rotate(-0 915.84 224.627188)">Shape behavior / responses / actions</text>
   </g>
   <g id="text_10">
    <text style="fill: #172b4d; font: 15px 'DejaVu Sans'" transform="translate(138.333984 287.462813)">Large mixed corpora</text>
    <text style="fill: #172b4d; font: 15px 'DejaVu Sans'" transform="translate(105.965625 306.539063)">Usually next-token prediction</text>
    <text style="fill: #172b4d; font: 15px 'DejaVu Sans'" transform="translate(86.782031 325.615313)">FIM / auxiliary targets may coexist</text>
   </g>
   <g id="text_11">
    <text style="fill: #172b4d; font: 14px 'DejaVu Sans'" transform="translate(135.976875 412.560875)">Broad base checkpoint</text>
    <text style="fill: #172b4d; font: 14px 'DejaVu Sans'" transform="translate(69.497656 430.365375)">Quality and mixture matter from the start</text>
   </g>
   <g id="text_12">
    <text style="fill: #172b4d; font: 15px 'DejaVu Sans'" transform="translate(536.823047 287.462813)">Domain / capability emphasis</text>
    <text style="fill: #172b4d; font: 15px 'DejaVu Sans'" transform="translate(573.041016 306.539063)">Reasoning-rich data</text>
    <text style="fill: #172b4d; font: 15px 'DejaVu Sans'" transform="translate(555.873047 325.615313)">Long-context adaptation</text>
   </g>
   <g id="text_13">
    <text style="fill: #172b4d; font: 14px 'DejaVu Sans'" transform="translate(563.644531 412.560875)">Often continued LM loss</text>
    <text style="fill: #172b4d; font: 14px 'DejaVu Sans'" transform="translate(521.084531 430.365375)">Defined by purpose / data transition</text>
   </g>
   <g id="text_14">
    <text style="fill: #172b4d; font: 13px 'DejaVu Sans'; text-anchor: middle" x="1080" y="272.147188" transform="rotate(-0 1080 272.147188)">SFT: instruction / CoT / tool-agent targets</text>
   </g>
   <g id="text_15">
    <text style="fill: #172b4d; font: 13px 'DejaVu Sans'; text-anchor: middle" x="1080" y="326.147188" transform="rotate(-0 1080 326.147188)">Direct preferences: e.g. offline DPO</text>
   </g>
   <g id="text_16">
    <text style="fill: #172b4d; font: 13px 'DejaVu Sans'; text-anchor: middle" x="1080" y="380.147188" transform="rotate(-0 1080 380.147188)">Rollout RL: feedback + chosen update rule</text>
   </g>
   <g id="text_17">
    <text style="fill: #172b4d; font: 13px 'DejaVu Sans'; text-anchor: middle" x="1080" y="434.147188" transform="rotate(-0 1080 434.147188)">Teacher feedback: offline / OPD / OPSD</text>
   </g>
   <g id="text_18">
    <text style="fill: #52657a; font: 13px 'DejaVu Sans'; text-anchor: middle" x="1080" y="480.947188" transform="rotate(-0 1080 480.947188)">Compatible routes; not four required steps</text>
   </g>
   <g id="text_19">
    <text style="fill: #172b4d; font: 700 20px 'DejaVu Sans'; text-anchor: start" x="51.84" y="573.59875" transform="rotate(-0 51.84 573.59875)">EXAMPLE POST-TRAINING LOOP</text>
   </g>
   <g id="text_20">
    <text style="fill: #52657a; font: 13px 'DejaVu Sans'; text-anchor: start" x="51.84" y="599.027188" transform="rotate(-0 51.84 599.027188)">SFT can follow RL again; direct preferences and teacher feedback can enter at different points.</text>
   </g>
   <g id="text_21">
    <text style="fill: #172b4d; font: 17px 'DejaVu Sans'; text-anchor: middle" x="198" y="651.250938" transform="rotate(-0 198 651.250938)">SFT / refreshed checkpoint</text>
   </g>
   <g id="text_22">
    <text style="fill: #172b4d; font: 19px 'DejaVu Sans'; text-anchor: middle" x="568.8" y="651.802813" transform="rotate(-0 568.8 651.802813)">RL</text>
   </g>
   <g id="text_23">
    <text style="fill: #172b4d; font: 16px 'DejaVu Sans'; text-anchor: middle" x="1000.8" y="650.975" transform="rotate(-0 1000.8 650.975)">Generate / collect + verify new training data</text>
   </g>
   <g id="text_24">
    <text style="fill: #a76a0b; font: 13px 'DejaVu Sans'; text-anchor: middle" x="597.6" y="696.947188" transform="rotate(-0 597.6 696.947188)">New verified demonstrations / targets feed a later SFT round</text>
   </g>
   <g id="text_25">
    <text style="fill: #172b4d; font: 16px 'DejaVu Sans'" transform="translate(442.21125 798.841)">CROSS-CUTTING TRACKS THROUGH DEVELOPMENT</text>
    <text style="fill: #172b4d; font: 16px 'DejaVu Sans'" transform="translate(199.72625 819.189)">Data quality / decontamination  ·  Safety behavior  ·  Independent evaluation / retention  ·  Compute / efficiency</text>
   </g>
   <g id="text_26">
    <text style="fill: #7953a6; font: 700 20px 'DejaVu Sans'; text-anchor: middle" x="648" y="901.840625" transform="rotate(-0 648 901.840625)">RECURRING WORKSTREAM: specialized adaptation + release / serving</text>
   </g>
   <g id="text_27">
    <text style="fill: #172b4d; font: 15px 'DejaVu Sans'; text-anchor: middle" x="648" y="934.379063" transform="rotate(-0 648 934.379063)">Domain/tool adaptation, compact students and behavioral hardening reuse the training routes above.</text>
   </g>
   <g id="text_28">
    <text style="fill: #172b4d; font: 14px 'DejaVu Sans'; text-anchor: middle" x="648" y="963.623125" transform="rotate(-0 648 963.623125)">Runtime kernels, cache layouts and serving are execution choices; observed failures can inform later training.</text>
   </g>
   <g id="text_29">
    <text style="fill: #52657a; font: 14px 'DejaVu Sans'; text-anchor: start" x="43.2" y="1019.063125" transform="rotate(-0 43.2 1019.063125)">This workstream is not a mandatory fourth training objective. Deployment does not automatically update model weights.</text>
   </g>
  </g>
 </g>
 <defs>
  <clipPath id="pd6a6195b91">
   <rect x="0" y="0" width="1296" height="1044"/>
