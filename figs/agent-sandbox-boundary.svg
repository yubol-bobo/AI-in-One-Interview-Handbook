   <g id="text_1">
    <text style="fill: #172b4d; font: 700 27px 'DejaVu Sans'; text-anchor: start" x="43.2" y="41.904844" transform="rotate(-0 43.2 41.904844)">Agent sandbox: isolate execution, authorize actions, grade independently</text>
   </g>
   <g id="text_2">
    <text style="fill: #52657a; font: 14px 'DejaVu Sans'; text-anchor: start" x="43.2" y="70.103125" transform="rotate(-0 43.2 70.103125)">[To be reviewed]  Conceptual coding-agent design; policy and runtime choices must be enforced outside candidate code.</text>
   </g>
   <g id="text_3">
    <text style="fill: #172b4d; font: 700 20px 'DejaVu Sans'; text-anchor: start" x="36" y="142.31875" transform="rotate(-0 36 142.31875)">MODEL / AGENT</text>
   </g>
   <g id="text_4">
    <text style="fill: #172b4d; font: 17px 'DejaVu Sans'" transform="translate(109.450234 213.481063)">Propose a tool call</text>
    <text style="fill: #172b4d; font: 17px 'DejaVu Sans'" transform="translate(55.516406 235.100813)">Arguments are untrusted input</text>
   </g>
   <g id="text_5">
    <text style="fill: #21856d; font: 700 20px 'DejaVu Sans'; text-anchor: start" x="396" y="142.31875" transform="rotate(-0 396 142.31875)">TRUSTED CONTROL PLANE</text>
   </g>
   <g id="text_6">
    <text style="fill: #172b4d; font: 16px 'DejaVu Sans'" transform="translate(501.885 213.841)">Policy / tool broker</text>
    <text style="fill: #172b4d; font: 16px 'DejaVu Sans'" transform="translate(400.3225 234.189)">Validate identity, scope, arguments, budget</text>
   </g>
   <g id="text_7">
    <text style="fill: #172b4d; font: 14px 'DejaVu Sans'" transform="translate(420.59125 331.920875)">Externally defined policy / scoped interfaces</text>
    <text style="fill: #172b4d; font: 14px 'DejaVu Sans'" transform="translate(421.559219 349.725375)">No inherited general-purpose host authority</text>
   </g>
   <g id="text_8">
    <text style="fill: #172b4d; font: 700 20px 'DejaVu Sans'; text-anchor: start" x="879.84" y="155.99875" transform="rotate(-0 879.84 155.99875)">CONSTRAINED WORKER</text>
   </g>
   <g id="text_9">
    <text style="fill: #52657a; font: 13px 'DejaVu Sans'; text-anchor: start" x="879.84" y="181.427188" transform="rotate(-0 879.84 181.427188)">Generated code / repository scripts remain untrusted</text>
   </g>
   <g id="text_10">
    <text style="fill: #172b4d; font: 15px 'DejaVu Sans'" transform="translate(922.282031 239.400937)">Execute code, builds and public tests</text>
    <text style="fill: #172b4d; font: 15px 'DejaVu Sans'" transform="translate(918.802734 258.477187)">Inside the selected isolation boundary</text>
   </g>
   <g id="text_11">
    <text style="fill: #172b4d; font: 15px 'DejaVu Sans'" transform="translate(928.829297 334.800937)">Scoped input + writable workspace</text>
    <text style="fill: #172b4d; font: 15px 'DejaVu Sans'" transform="translate(924.718359 353.877187)">No unrelated host mounts or secrets</text>
   </g>
   <g id="text_12">
    <text style="fill: #172b4d; font: 14px 'DejaVu Sans'" transform="translate(913.070625 425.160875)">Controlled network / CPU / memory / tasks</text>
    <text style="fill: #172b4d; font: 14px 'DejaVu Sans'" transform="translate(908.91875 442.965375)">External wall deadline + output / disk limits</text>
   </g>
   <g id="text_13">
    <text style="fill: #172b4d; font: 16px 'DejaVu Sans'" transform="translate(424.51 440.641)">Bounded observations + typed status</text>
    <text style="fill: #172b4d; font: 16px 'DejaVu Sans'" transform="translate(401.0725 460.989)">Trusted metadata; workload text stays data</text>
   </g>
   <g id="text_14">
    <text style="fill: #2669a8; font: 13px 'DejaVu Sans'; text-anchor: middle" x="288" y="428.387188" transform="rotate(-0 288 428.387188)">Return as observations</text>
   </g>
   <g id="text_15">
    <text style="fill: #172b4d; font: 15px 'DejaVu Sans'" transform="translate(898.038281 574.200938)">Capture the declared artifact + provenance</text>
    <text style="fill: #172b4d; font: 15px 'DejaVu Sans'" transform="translate(929.711719 593.277188)">Do not accept a self-reported score</text>
   </g>
   <g id="text_16">
    <text style="fill: #172b4d; font: 700 20px 'DejaVu Sans'; text-anchor: start" x="51.84" y="677.99875" transform="rotate(-0 51.84 677.99875)">SEPARATE EVALUATION INFRASTRUCTURE</text>
   </g>
   <g id="text_17">
    <text style="fill: #52657a; font: 13px 'DejaVu Sans'; text-anchor: start" x="51.84" y="703.427187" transform="rotate(-0 51.84 703.427187)">The actor cannot rewrite grading policy or authoritative results; submitted code is untrusted during evaluation too.</text>
   </g>
   <g id="text_18">
    <text style="fill: #172b4d; font: 16px 'DejaVu Sans'" transform="translate(110.30625 752.667)">Trusted evaluation controller</text>
    <text style="fill: #172b4d; font: 16px 'DejaVu Sans'" transform="translate(135.835 773.015)">Fixed grading protocol</text>
    <text style="fill: #172b4d; font: 16px 'DejaVu Sans'" transform="translate(124.8475 793.363)">Authoritative result store</text>
   </g>
   <g id="text_19">
    <text style="fill: #172b4d; font: 16px 'DejaVu Sans'" transform="translate(750.97125 752.667)">Fresh constrained evaluation worker</text>
    <text style="fill: #172b4d; font: 16px 'DejaVu Sans'" transform="translate(654.6475 773.015)">Base snapshot + submitted artifact + declared test protocol</text>
    <text style="fill: #172b4d; font: 16px 'DejaVu Sans'" transform="translate(636.65 793.363)">Execute candidate code here, not inside the privileged controller</text>
   </g>
   <g id="text_20">
    <text style="fill: #21856d; font: 13px 'DejaVu Sans'; text-anchor: middle" x="476.64" y="748.067188" transform="rotate(-0 476.64 748.067188)">Start evaluation</text>
   </g>
   <g id="text_21">
    <text style="fill: #2669a8; font: 13px 'DejaVu Sans'; text-anchor: middle" x="583.2" y="837.347188" transform="rotate(-0 583.2 837.347188)">Collect results through the defined grading channel</text>
   </g>
   <g id="text_22">
    <text style="fill: #172b4d; font: 700 15px 'DejaVu Sans'; text-anchor: start" x="43.2" y="929.339062" transform="rotate(-0 43.2 929.339062)">Isolation does not replace semantic authorization. A disposable workspace does not undo remote side effects.</text>
   </g>
   <g id="text_23">
    <text style="fill: #52657a; font: 14px 'DejaVu Sans'; text-anchor: start" x="43.2" y="967.223125" transform="rotate(-0 43.2 967.223125)">This is a boundary schematic, not a runnable security configuration or proof that an evaluator is correct.</text>
   </g>
  </g>
 </g>
 <defs>
